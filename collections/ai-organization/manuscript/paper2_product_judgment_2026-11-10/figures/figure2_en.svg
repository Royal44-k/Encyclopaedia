<svg xmlns="http://www.w3.org/2000/svg" width="491pt" height="251pt" viewBox="0 0 491 251"><defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#247c73"/></marker></defs><rect width="491" height="251" fill="white"/><text x="12" y="18" font-family="Arial, Microsoft YaHei" font-size="12" fill="#18313a" text-anchor="start" font-weight="700"><tspan x="12" dy="0">Start with the uncertainty that matters</tspan></text><rect id="route0" x="12" y="38" width="145" height="171" rx="4" fill="#f4f6f6" stroke="#b6c7ca" stroke-width="0.7"/><text x="21" y="60" font-family="Arial, Microsoft YaHei" font-size="10" fill="#18313a" text-anchor="start" font-weight="700"><tspan x="21" dy="0">Problem and purchase</tspan></text><path d="M21 73L148 73" stroke="#b6c7ca" stroke-width="0.8"/><text x="21" y="98" font-family="Arial, Microsoft YaHei" font-size="9.5" fill="#18313a" text-anchor="start" font-weight="400"><tspan x="21" dy="0">Contact customers first</tspan></text><text x="21" y="127" font-family="Arial, Microsoft YaHei" font-size="9.2" fill="#18313a" text-anchor="start" font-weight="400"><tspan x="21" dy="0">When does the task arise?</tspan><tspan x="21" dy="13.799999999999999">Who decides and pays?</tspan></text><text x="21" y="192" font-family="Arial, Microsoft YaHei" font-size="8.8" fill="#18313a" text-anchor="start" font-weight="400"><tspan x="21" dy="0">Check actual behaviour</tspan></text><rect id="route1" x="173" y="38" width="145" height="171" rx="4" fill="#e7f1ef" stroke="#b6c7ca" stroke-width="0.7"/><text x="182" y="60" font-family="Arial, Microsoft YaHei" font-size="10" fill="#18313a" text-anchor="start" font-weight="700"><tspan x="182" dy="0">Experience and interaction</tspan></text><path d="M182 73L309 73" stroke="#b6c7ca" stroke-width="0.8"/><text x="182" y="98" font-family="Arial, Microsoft YaHei" font-size="9.5" fill="#18313a" text-anchor="start" font-weight="400"><tspan x="182" dy="0">Build a minimal prototype</tspan></text><text x="182" y="127" font-family="Arial, Microsoft YaHei" font-size="9.2" fill="#18313a" text-anchor="start" font-weight="400"><tspan x="182" dy="0">Can users finish the task?</tspan><tspan x="182" dy="13.799999999999999">What blocks the experience?</tspan></text><text x="182" y="192" font-family="Arial, Microsoft YaHei" font-size="8.8" fill="#18313a" text-anchor="start" font-weight="400"><tspan x="182" dy="0">Separate appeal from need</tspan></text><rect id="route2" x="334" y="38" width="145" height="171" rx="4" fill="#f4f6f6" stroke="#b6c7ca" stroke-width="0.7"/><text x="343" y="60" font-family="Arial, Microsoft YaHei" font-size="10" fill="#18313a" text-anchor="start" font-weight="700"><tspan x="343" dy="0">A complex workflow</tspan></text><path d="M343 73L470 73" stroke="#b6c7ca" stroke-width="0.8"/><text x="343" y="98" font-family="Arial, Microsoft YaHei" font-size="9.5" fill="#18313a" text-anchor="start" font-weight="400"><tspan x="343" dy="0">Iterate with customers</tspan></text><text x="343" y="127" font-family="Arial, Microsoft YaHei" font-size="9.2" fill="#18313a" text-anchor="start" font-weight="400"><tspan x="343" dy="0">How does the product fit?</tspan><tspan x="343" dy="13.799999999999999">Does it work for new users?</tspan></text><text x="343" y="192" font-family="Arial, Microsoft YaHei" font-size="8.8" fill="#18313a" text-anchor="start" font-weight="400"><tspan x="343" dy="0">Check representativeness</tspan></text><text x="12" y="231" font-family="Arial, Microsoft YaHei" font-size="9" fill="#18313a" text-anchor="start" font-weight="400"><tspan x="12" dy="0">Proposed matches / Compare resources and allow sequences to change</tspan></text></svg>