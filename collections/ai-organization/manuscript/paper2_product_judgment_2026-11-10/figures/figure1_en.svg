<svg xmlns="http://www.w3.org/2000/svg" width="491pt" height="244pt" viewBox="0 0 491 244"><defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#247c73"/></marker></defs><rect width="491" height="244" fill="white"/><text x="12" y="17" font-family="Arial, Microsoft YaHei" font-size="12" fill="#18313a" text-anchor="start" font-weight="700"><tspan x="12" dy="0">One low-use result, three possible explanations</tspan></text><rect id="observation" x="12" y="34" width="467" height="37" rx="4" fill="#f6f2e9" stroke="#b6c7ca" stroke-width="0.7"/><text x="245" y="57" font-family="Arial, Microsoft YaHei" font-size="11" fill="#18313a" text-anchor="middle" font-weight="400"><tspan x="245" dy="0">Users like the demonstration but rarely return</tspan></text><path d="M84 73 L84 91" fill="none" stroke="#247c73" stroke-width="1.2" marker-end="url(#arrow)"/><rect id="cause0" x="12" y="96" width="145" height="119" rx="4" fill="#e7f1ef" stroke="#b6c7ca" stroke-width="0.7"/><text x="22" y="117" font-family="Arial, Microsoft YaHei" font-size="10" fill="#18313a" text-anchor="start" font-weight="700"><tspan x="22" dy="0">The task is infrequent</tspan></text><path d="M22 129L147 129" stroke="#b6c7ca" stroke-width="0.8"/><text x="22" y="151" font-family="Arial, Microsoft YaHei" font-size="9.5" fill="#18313a" text-anchor="start" font-weight="400"><tspan x="22" dy="0">Check recent task history</tspan></text><text x="22" y="190" font-family="Arial, Microsoft YaHei" font-size="9.5" fill="#18313a" text-anchor="start" font-weight="400"><tspan x="22" dy="0">Reassess the segment</tspan></text><path d="M245 73 L245 91" fill="none" stroke="#247c73" stroke-width="1.2" marker-end="url(#arrow)"/><rect id="cause1" x="173" y="96" width="145" height="119" rx="4" fill="#e7f1ef" stroke="#b6c7ca" stroke-width="0.7"/><text x="183" y="117" font-family="Arial, Microsoft YaHei" font-size="10" fill="#18313a" text-anchor="start" font-weight="700"><tspa