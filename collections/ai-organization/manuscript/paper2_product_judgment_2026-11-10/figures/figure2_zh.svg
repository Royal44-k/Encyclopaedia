<svg xmlns="http://www.w3.org/2000/svg" width="491pt" height="251pt" viewBox="0 0 491 251"><defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#247c73"/></marker></defs><rect width="491" height="251" fill="white"/><text x="12" y="18" font-family="Arial, Microsoft YaHei" font-size="12" fill="#18313a" text-anchor="start" font-weight="700"><tspan x="12" dy="0">先明确未知，再选择验证方式</tspan></text><rect id="route0" x="12" y="38" width="145" height="171" rx="4" fill="#f4f6f6" stroke="#b6c7ca" stroke-width="0.7"/><text x="21" y="60" font-family="Arial, Microsoft YaHei" font-size="10" fill="#18313a" text-anchor="start" font-weight="700"><tspan x="21" dy="0">问题与购买流程</tspan></text><path d="M21 73L148 73" stroke="#b6c7ca" stroke-width="0.8"/><text x="21" y="98" font-family="Arial, Microsoft YaHei" font-size="9.5" fill="#18313a" text-anchor="start" font-weight="400"><tspan x="21" dy="0">先接触目标客户</tspan></text><text x="21" y="127" font-family="Arial, Microsoft YaHei" font-size="9.2" fill="#18313a" text-anchor="start" font-weight="400"><tspan x="21" dy="0">任务何时发生？</tspan><tspan x="21" dy="13.799999999999999">谁决定并付款？</tspan></text><text x="21" y="192" font-family="Arial, Microsoft YaHei" font-size="8.8" fill="#18313a" text-anchor="start" font-weight="400"><tspan x="21" dy="0">避免只听假设性意愿</tspan></text><rect id="route1" x="173" y="38" width="145" height="171" rx="4" fill="#e7f1ef" stroke="#b6c7ca" stroke-width="0.7"/><text x="182" y="60" font-family="Arial, Microsoft YaHei" font-size="10" fill="#18313a" text-anchor="start" font-weight="700"><tspan x="182" dy="0">体验与交互</tspan></text><path d="M182 73L309 73" stroke="#b6c7ca" stroke-width="0.8"/><text x="182" y="98" font-family="Arial, Microsoft YaHei" font-size="9.5" fill="#18313a" text-anchor="start" font-weight="400"><tspan x="182" dy="0">先做最小原型</tspan></text><text x="182" y="127" font-family="Arial, Microsoft YaHei" font-size="9.2" fill="#18313a" text-anchor="start" font-weig