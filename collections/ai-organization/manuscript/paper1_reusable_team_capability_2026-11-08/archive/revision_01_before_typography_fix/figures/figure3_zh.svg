<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="885" viewBox="0 0 1400 885"><rect width="1400" height="885" fill="white"/><g font-family="Microsoft YaHei, Arial, sans-serif"><text x="36" y="48" font-size="34" fill="#183332" font-weight="bold" text-anchor="start">检验交接方式，而不只检验工具能否运行</text><text x="36" y="91" font-size="25" fill="#657472" font-weight="normal" text-anchor="start">拟议研究设计  ·  图中没有实测数据</text><text x="36" y="147" font-size="27" fill="#183332" font-weight="normal" text-anchor="start">固定基础模型、源方法与任务池；预先限定相同支持预算</text><rect x="36" y="178" width="424" height="144" rx="9" fill="white" stroke="#C5D6D2" stroke-width="2"/><text x="60" y="221" font-size="29" fill="#247C73" font-weight="bold" text-anchor="start">A</text><text x="111" y="224" font-size="28" fill="#183332" font-weight="normal" text-anchor="start">仅提供提示词</text><rect x="488" y="178" width="424" height="144" rx="9" fill="white" stroke="#C5D6D2" stroke-width="2"/><text x="512" y="221" font-size="29" fill="#247C73" font-weight="bold" text-anchor="start">B</text><text x="563" y="224" font-size="28" fill="#183332" font-weight="normal" text-anchor="start">提供可运行方法</text><rect x="940" y="178" width="424" height="144" rx="9" fill="#EAF4F1" stroke="#C5D6D2" stroke-width="2"/><text x="964" y="221" font-size="29" fill="#247C73" font-weight="bold" text-anchor="start">C</text><text x="1015" y="224" font-size="28" fill="#183332" font-weight="normal" text-anchor="start">可运行方法</text><text x="1015" y="264" font-size="28" fill="#183332" font-weight="normal" text-anchor="start">加交接与维护支持</text><text x="36" y="378" font-size="28" fill="#183332" font-weight="bold" text-anchor="start">在不同任务条件下观察同事能否继续完成工作</text><text x="50" y="434" font-size="29" fill="#247C73" font-weight="bold" text-anchor="start">首次使用</text><text x="50" y="477" font-size="24" fill="#183332" font-weight="normal" text-anchor="start">新同事能否启动并交付</text><path d="M426 426 L470 426" fill="none" stroke="#247C73" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M460 420 L470 426 L460 432" fill="none" stroke="#247C73" stroke-width="3"/><text x="502" y="434" font-size="29" fill="#247C73" font-weight="bold" text-anchor="start">延后再用</text><text x="502" y="477" font-size="24" fill="#183332" font-weight="normal" text-anchor="start">隔一段时间能否再次完成</text><path d="M878 426 L922 426" fill="none" stroke="#247C73" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M912 420 L922 426 L912 432" fill="none" stroke="#247C73" stroke-width="3"/><text x="954" y="434" font-size="29" fill="#247C73" font-weight="bold" text-anchor="start">单独改变条件</text><text x="954" y="477" font-size="24" fill="#183332" font-weight="normal" text-anchor="start">更换输入或工具版本</text><path d="M36 526 L1364 526" fill="none" stroke="#C5D6D2" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="36" y="574" font-size="27" fill="#247C73" font-weight="normal" text-anchor="start">分别观察运行、适用范围判断与修订回传</text><text x="36" y="629" font-size="28" fill="#183332" font-weight="bold" text-anchor="start">并列报告</text><rect x="44" y="674" width="70" height="86" rx="6" fill="#EAF4F1" stroke="#247C73" stroke-width="2"/><path d="M59 699 L99 699" fill="none" stroke="#247C73" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M59 716 L99 716" fill="none" stroke="#247C73" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M59 733 L99 733" fill="none" stroke="#247C73" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="146" y="685" font-size="25" fill="#183332" font-weight="normal" text-anchor="start">输出质量、关键遗漏与失败</text><text x="146" y="724" font-size="25" fill="#183332" font-weight="normal" text-anchor="start">保留放弃使用的记录</text><text x="146" y="763" font-size="25" fill="#183332" font-weight="normal" text-anchor="start">由不知道分组的评分者评估</text><rect x="747" y="679" width="86" height="77" rx="7" fill="#EAF4F1" stroke="#247C73" stroke-width="2"/><path d="M747 703 L833 703 M768 670 L768 689 M812 670 L812 689" fill="none" stroke="#247C73" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M770 726 L785 740 L814 713" fill="none" stroke="#247C73" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><text x="861" y="685" font-size="25" fill="#183332" font-weight="normal" text-anchor="start">制作者与接收者的总投入</text><text x="861" y="724" font-size="25" fill="#183332" font-weight="normal" text-anchor="start">含准备、适配、答疑</text><text x="861" y="763" font-size="25" fill="#183332" font-weight="normal" text-anchor="start">以及后续维护</text><text x="36" y="847" font-size="25" fill="#657472" font-weight="normal" text-anchor="start">公开仓库适合研究材料与版本变化；上述行为结果需要另行取得使用证据。</text></g></svg>