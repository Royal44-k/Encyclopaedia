<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="885" viewBox="0 0 1400 885"><rect width="1400" height="885" fill="white"/><g font-family="Microsoft YaHei, Arial, sans-serif"><text x="36" y="48" font-size="34" fill="#183332" font-weight="bold" text-anchor="start">Test the handover, not only whether the tool runs</text><text x="36" y="91" font-size="25" fill="#657472" font-weight="normal" text-anchor="start">Proposed research design  ·  No observed results are shown</text><text x="36" y="147" font-size="27" fill="#183332" font-weight="normal" text-anchor="start">Hold model, source method and task pool constant; set an equal support budget</text><rect x="36" y="178" width="424" height="144" rx="9" fill="white" stroke="#C5D6D2" stroke-width="2"/><text x="60" y="221" font-size="29" fill="#247C73" font-weight="bold" text-anchor="start">A</text><text x="111" y="224" font-size="28" fill="#183332" font-weight="normal" text-anchor="start">Prompt only</text><rect x="488" y="178" width="424" height="144" rx="9" fill="white" stroke="#C5D6D2" stroke-width="2"/><text x="512" y="221" font-size="29" fill="#247C73" font-weight="bold" text-anchor="start">B</text><text x="563" y="224" font-size="28" fill="#183332" font-weight="normal" text-anchor="start">Runnable method</text><rect x="940" y="178" width="424" height="144" rx="9" fill="#EAF4F1" stroke="#C5D6D2" stroke-width="2"/><text x="964" y="221" font-size="29" fill="#247C73" font-weight="bold" text-anchor="start">C</text><text x="1015" y="224" font-size="28" fill="#183332" font-weight="normal" text-anchor="start">Runnable method</text><text x="1015" y="264" font-size="28" fill="#183332" font-weight="normal" text-anchor="start">plus handover support</text><text x="36" y="378" font-size="28" fill="#183332" font-weight="bold" text-anchor="start">Observe colleagues across separate task conditions</text><text x="50" y="434" font-size="29" fill="#247C73" font-weight="bold" text-anchor="start">First use</text><text x="50" y="477" font-size="24" fill="#183332" font-weight="normal" text-anchor="start">Can the colleague start and deliver?</text><path d="M426 426 L470 426" fill="none" stroke="#247C73" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M460 420 L470 426 L460 432" fill="none" stroke="#247C73" stroke-width="3"/><text x="502" y="434" font-size="29" fill="#247C73" font-weight="bold" text-anchor="start">Delayed reuse</text><text x="502" y="477" font-size="24" fill="#183332" font-weight="normal" text-anchor="start">Can the work be repeated later?</text><path d="M878 426 L922 426" fill="none" stroke="#247C73" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M912 420 L922 426 L912 432" fill="none" stroke="#247C73" stroke-width="3"/><text x="954" y="434" font-size="29" fill="#247C73" font-weight="bold" text-anchor="start">Change one condition</text><text x="954" y="477" font-size="24" fill="#183332" font-weight="normal" text-anchor="start">Vary inputs or the tool version</text><path d="M36 526 L1364 526" fill="none" stroke="#C5D6D2" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="36" y="574" font-size="27" fill="#247C73" font-weight="normal" text-anchor="start">Track execution, scope judgements and returned revisions separately</text><text x="36" y="629" font-size="28" fill="#183332" font-weight="bold" text-anchor="start">Report together</text><rect x="44" y="674" width="70" height="86" rx="6" fill="#EAF4F1" stroke="#247C73" stroke-width="2"/><path d="M59 699 L99 699" fill="none" stroke="#247C73" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M59 716 L99 716" fill="none" stroke="#247C73" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M59 733 L99 733" fill="none" stroke="#247C73" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="146" y="685" font-size="25" fill="#183332" font-weight="normal" text-anchor="start">Quality, omissions and failures</text><text x="146" y="724" font-size="25" fill="#183332" font-weight="normal" text-anchor="start">Retain abandoned attempts</text><text x="146" y="763" font-size="25" fill="#183332" font-weight="normal" text-anchor="start">Use assessors blind to allocation</text><rect x="747" y="679" width="86" height="77" rx="7" fill="#EAF4F1" stroke="#247C73" stroke-width="2"/><path d="M747 703 L833 703 M768 670 L768 689 M812 670 L812 689" fill="none" stroke="#247C73" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M770 726 L785 740 L814 713" fill="none" stroke="#247C73" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><text x="861" y="685" font-size="25" fill="#183332" font-weight="normal" text-anchor="start">Total effort on both sides</text><text x="861" y="724" font-size="25" fill="#183332" font-weight="normal" text-anchor="start">Include preparation, help,</text><text x="861" y="763" font-size="25" fill="#183332" font-weight="normal" text-anchor="start">adaptation and maintenance</text><text x="36" y="847" font-size="25" fill="#657472" font-weight="normal" text-anchor="start">Public repositories reveal artifacts and revisions; behavioural outcomes require use evidence.</text></g></svg>