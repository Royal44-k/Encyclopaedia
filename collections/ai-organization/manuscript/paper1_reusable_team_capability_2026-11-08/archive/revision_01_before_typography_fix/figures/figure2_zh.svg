<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="915" viewBox="0 0 1400 915"><rect width="1400" height="915" fill="white"/><g font-family="Microsoft YaHei, Arial, sans-serif"><text x="36" y="48" font-size="34" fill="#183332" font-weight="bold" text-anchor="start">同事拿到的可以是一页能用的工作方法</text><text x="36" y="91" font-size="25" fill="#657472" font-weight="normal" text-anchor="start">每日 AI 简报交接示例  ·  作者设计示意，非报告中的原始 Skill</text><g transform="translate(124 267) scale(1.15)"><circle cx="0" cy="-20" r="22" fill="#EAF4F1" stroke="#247C73" stroke-width="3"/><path d="M-40 55 Q-40 13 0 13 Q40 13 40 55" fill="none" stroke="#247C73" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/></g><text x="124" y="365" font-size="27" fill="#183332" font-weight="normal" text-anchor="middle">原制作者</text><g transform="translate(1262 267) scale(1.15)"><circle cx="0" cy="-20" r="22" fill="#EAF4F1" stroke="#247C73" stroke-width="3"/><path d="M-40 55 Q-40 13 0 13 Q40 13 40 55" fill="none" stroke="#247C73" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/></g><text x="1262" y="365" font-size="27" fill="#183332" font-weight="normal" text-anchor="middle">接收同事</text><path d="M180 285 L260 285" fill="none" stroke="#247C73" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M250 279 L260 285 L250 291" fill="none" stroke="#247C73" stroke-width="3"/><path d="M1130 285 L1204 285" fill="none" stroke="#247C73" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M1194 279 L1204 285 L1194 291" fill="none" stroke="#247C73" stroke-width="3"/><rect x="279" y="132" width="832" height="652" rx="4" fill="white" stroke="#C5D6D2" stroke-width="2"/><rect x="279" y="132" width="832" height="66" rx="4" fill="#EAF4F1" stroke="#C5D6D2" stroke-width="2"/><text x="307" y="176" font-size="27" fill="#183332" font-weight="bold" text-anchor="start">每日 AI 简报  /  工作方法与交接说明</text><text x="307" y="237" font-size="25" fill="#247C73" font-weight="bold" text-anchor="start">用途与范围</text><text x="493" y="235" font-size="26" fill="#183332" font-weight="normal" text-anchor="start">供组内了解进展；注明时间窗口</text><text x="493" y="268" font-size="26" fill="#183332" font-weight="normal" text-anchor="start">不承担采购或法律判断</text><path d="M299 294 L1091 294" fill="none" stroke="#C5D6D2" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><text x="307" y="333" font-size="25" fill="#247C73" font-weight="bold" text-anchor="start">输入与访问</text><text x="493" y="331" font-size="26" fill="#183332" font-weight="normal" text-anchor="start">可访问的来源链接与发布日期</text><text x="493" y="364" font-size="26" fill="#183332" font-weight="normal" text-anchor="start">无法读取的材料单独列出</text><path d="M299 390 L1091 390" fill="none" stroke="#C5D6D2" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><text x="307" y="429" font-size="25" fill="#247C73" font-weight="bold" text-anchor="start">运行办法</text><text x="493" y="427" font-size="26" fill="#183332" font-weight="normal" text-anchor="start">提供共享指令、必要材料与操作步骤</text><text x="493" y="460" font-size="26" fill="#183332" font-weight="normal" text-anchor="start">确认同事具备所需工具和权限</text><path d="M299 486 L1091 486" fill="none" stroke="#C5D6D2" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><text x="307" y="525" font-size="25" fill="#247C73" font-weight="bold" text-anchor="start">交付样例</text><text x="493" y="523" font-size="26" fill="#183332" font-weight="normal" text-anchor="start">要点 + 原始链接 + 日期 + 不确定之处</text><text x="493" y="556" font-size="26" fill="#183332" font-weight="normal" text-anchor="start">配一个通过样例和一个失败样例</text><path d="M299 582 L1091 582" fill="none" stroke="#C5D6D2" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><text x="307" y="621" font-size="25" fill="#247C73" font-weight="bold" text-anchor="start">边界判断</text><text x="493" y="619" font-size="26" fill="#183332" font-weight="normal" text-anchor="start">区分宣布、测试与正式发布</text><text x="493" y="652" font-size="26" fill="#183332" font-weight="normal" text-anchor="start">关键事实未确认时保留待核实标记</text><path d="M299 678 L1091 678" fill="none" stroke="#C5D6D2" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><text x="307" y="717" font-size="25" fill="#247C73" font-weight="bold" text-anchor="start">修改与维护</text><text x="493" y="715" font-size="26" fill="#183332" font-weight="normal" text-anchor="start">写明维护联系人和最近复核日期</text><text x="493" y="748" font-size="26" fill="#183332" font-weight="normal" text-anchor="start">岗位特有改动可保留为独立变体</text><path d="M1262 442 L1262 831 L696 831 L696 789" fill="none" stroke="#247C73" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M690 799 L696 789 L702 799" fill="none" stroke="#247C73" stroke-width="3"/><text x="700" y="877" font-size="25" fill="#247C73" font-weight="normal" text-anchor="middle">使用中的问题与改动返回团队，由指定人员决定更新或保留变体</text></g></svg>