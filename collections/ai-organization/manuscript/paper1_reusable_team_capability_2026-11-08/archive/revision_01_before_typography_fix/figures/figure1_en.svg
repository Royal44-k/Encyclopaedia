<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="580" viewBox="0 0 1400 580"><rect width="1400" height="580" fill="white"/><g font-family="Microsoft YaHei, Arial, sans-serif"><text x="36" y="92" font-size="25" fill="#657472" font-weight="normal" text-anchor="start">Practice described in the Tencent Research Institute report</text><text x="36" y="48" font-size="34" fill="#183332" font-weight="bold" text-anchor="start">A shared task outlasts the holiday</text><circle cx="172" cy="212" r="68" fill="#EAF4F1"/><rect x="129" y="177" width="86" height="77" rx="7" fill="#EAF4F1" stroke="#247C73" stroke-width="2"/><path d="M129 201 L215 201 M150 168 L150 187 M194 168 L194 187" fill="none" stroke="#247C73" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M152 224 L167 238 L196 211" fill="none" stroke="#247C73" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><text x="172" y="321" font-size="22" fill="#247C73" font-weight="bold" text-anchor="middle">01</text><text x="172" y="366" font-size="28" fill="#183332" font-weight="normal" text-anchor="middle">Track AI news</text><text x="172" y="406" font-size="28" fill="#183332" font-weight="normal" text-anchor="middle">during the holiday</text><path d="M259 212 L437 212" fill="none" stroke="#247C73" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M427 206 L437 212 L427 218" fill="none" stroke="#247C73" stroke-width="3"/><circle cx="524" cy="212" r="68" fill="#EAF4F1"/><rect x="489" y="172" width="70" height="86" rx="6" fill="#EAF4F1" stroke="#247C73" stroke-width="2"/><path d="M504 197 L544 197" fill="none" stroke="#247C73" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M504 214 L544 214" fill="none" stroke="#247C73" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M504 231 L544 231" fill="none" stroke="#247C73" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="524" y="321" font-size="22" fill="#247C73" font-weight="bold" text-anchor="middle">02</text><text x="524" y="366" font-size="28" fill="#183332" font-weight="normal" text-anchor="middle">Share a Skill</text><text x="524" y="406" font-size="28" fill="#183332" font-weight="normal" text-anchor="middle">within the team</text><path d="M611 212 L789 212" fill="none" stroke="#247C73" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M779 206 L789 212 L779 218" fill="none" stroke="#247C73" stroke-width="3"/><circle cx="876" cy="212" r="68" fill="#EAF4F1"/><g transform="translate(876 207) scale(1)"><circle cx="0" cy="-20" r="22" fill="#EAF4F1" stroke="#247C73" stroke-width="3"/><path d="M-40 55 Q-40 13 0 13 Q40 13 40 55" fill="none" stroke="#247C73" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/></g><text x="876" y="321" font-size="22" fill="#247C73" font-weight="bold" text-anchor="middle">03</text><text x="876" y="366" font-size="28" fill="#183332" font-weight="normal" text-anchor="middle">Use it each day</text><text x="876" y="406" font-size="28" fill="#183332" font-weight="normal" text-anchor="middle">and revise it</text><path d="M963 212 L1141 212" fill="none" stroke="#247C73" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M1131 206 L1141 212 L1131 218" fill="none" stroke="#247C73" stroke-width="3"/><circle cx="1228" cy="212" r="68" fill="#EAF4F1"/><rect x="1185" y="177" width="86" height="77" rx="7" fill="#EAF4F1" stroke="#247C73" stroke-width="2"/><path d="M1185 201 L1271 201 M1206 168 L1206 187 M1250 168 L1250 187" fill="none" stroke="#247C73" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M1208 224 L1223 238 L1252 211" fill="none" stroke="#247C73" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><text x="1228" y="321" font-size="22" fill="#247C73" font-weight="bold" text-anchor="middle">04</text><text x="1228" y="366" font-size="28" fill="#183332" font-weight="normal" text-anchor="middle">Keep using it</text><text x="1228" y="406" font-size="28" fill="#183332" font-weight="normal" text-anchor="middle">after the holiday</text><path d="M53 455 L1347 455" fill="none" stroke="#C5D6D2" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="53" y="503" font-size="27" fill="#657472" font-weight="normal" text-anchor="start">These are reported actions, not estimated causal effects.</text><text x="53" y="544" font-size="25" fill="#657472" font-weight="normal" text-anchor="start">Usage logs, comparative quality and maintenance hours were not provided.</text></g></svg>