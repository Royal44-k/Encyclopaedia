<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="915" viewBox="0 0 1400 915"><rect width="1400" height="915" fill="white"/><g font-family="Microsoft YaHei, Arial, sans-serif"><text x="36" y="48" font-size="34" fill="#183332" font-weight="bold" text-anchor="start">What a colleague can receive with the working method</text><text x="36" y="91" font-size="25" fill="#657472" font-weight="normal" text-anchor="start">Illustrative daily AI brief handover  ·  Not the original Skill from the report</text><g transform="translate(124 267) scale(1.15)"><circle cx="0" cy="-20" r="22" fill="#EAF4F1" stroke="#247C73" stroke-width="3"/><path d="M-40 55 Q-40 13 0 13 Q40 13 40 55" fill="none" stroke="#247C73" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/></g><text x="124" y="365" font-size="27" fill="#183332" font-weight="normal" text-anchor="middle">Initial</text><text x="124" y="403" font-size="27" fill="#183332" font-weight="normal" text-anchor="middle">maker</text><g transform="translate(1262 267) scale(1.15)"><circle cx="0" cy="-20" r="22" fill="#EAF4F1" stroke="#247C73" stroke-width="3"/><path d="M-40 55 Q-40 13 0 13 Q40 13 40 55" fill="none" stroke="#247C73" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/></g><text x="1262" y="365" font-size="27" fill="#183332" font-weight="normal" text-anchor="middle">Receiving</text><text x="1262" y="403" font-size="27" fill="#183332" font-weight="normal" text-anchor="middle">colleague</text><path d="M180 285 L260 285" fill="none" stroke="#247C73" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M250 279 L260 285 L250 291" fill="none" stroke="#247C73" stroke-width="3"/><path d="M1130 285 L1204 285" fill="none" stroke="#247C73" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M1194 279 L1204 285 L1194 291" fill="none" stroke="#247C73" stroke-width="3"/><rect x="279" y="132" width="832" height="652" rx="4" fill="white" stroke="#C5D6D2" stroke-width="2"/><rect x="279" y="132" width="832" height="66" rx="4" fill="#EAF4F1" stroke="#C5D6D2" stroke-width="2"/><text x="307" y="176" font-size="27" fill="#183332" font-weight="bold" text-anchor="start">DAILY AI BRIEF  /  Method and handover notes</text><text x="307" y="237" font-size="25" fill="#247C73" font-weight="bold" text-anchor="start">Purpose</text><text x="501" y="235" font-size="26" fill="#183332" font-weight="normal" text-anchor="start">Team awareness; state the time window</text><text x="501" y="268" font-size="26" fill="#183332" font-weight="normal" text-anchor="start">Exclude purchasing or legal decisions</text><path d="M299 294 L1091 294" fill="none" stroke="#C5D6D2" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><text x="307" y="333" font-size="25" fill="#247C73" font-weight="bold" text-anchor="start">Inputs</text><text x="501" y="331" font-size="26" fill="#183332" font-weight="normal" text-anchor="start">Accessible sources and publication dates</text><text x="501" y="364" font-size="26" fill="#183332" font-weight="normal" text-anchor="start">List material that could not be accessed</text><path d="M299 390 L1091 390" fill="none" stroke="#C5D6D2" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><text x="307" y="429" font-size="25" fill="#247C73" font-weight="bold" text-anchor="start">Operation</text><text x="501" y="427" font-size="26" fill="#183332" font-weight="normal" text-anchor="start">Shared instructions, materials and steps</text><text x="501" y="460" font-size="26" fill="#183332" font-weight="normal" text-anchor="start">Check the colleague&#x27;s tools and access</text><path d="M299 486 L1091 486" fill="none" stroke="#C5D6D2" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><text x="307" y="525" font-size="25" fill="#247C73" font-weight="bold" text-anchor="start">Examples</text><text x="501" y="523" font-size="26" fill="#183332" font-weight="normal" text-anchor="start">Takeaway + source + date + uncertainty</text><text x="501" y="556" font-size="26" fill="#183332" font-weight="normal" text-anchor="start">Include an acceptable and a failed example</text><path d="M299 582 L1091 582" fill="none" stroke="#C5D6D2" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><text x="307" y="621" font-size="25" fill="#247C73" font-weight="bold" text-anchor="start">Limits</text><text x="501" y="619" font-size="26" fill="#183332" font-weight="normal" text-anchor="start">Separate announcement, preview and release</text><text x="501" y="652" font-size="26" fill="#183332" font-weight="normal" text-anchor="start">Flag key facts that remain unconfirmed</text><path d="M299 678 L1091 678" fill="none" stroke="#C5D6D2" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><text x="307" y="717" font-size="25" fill="#247C73" font-weight="bold" text-anchor="start">Maintenance</text><text x="501" y="715" font-size="26" fill="#183332" font-weight="normal" text-anchor="start">Name a contact and last review date</text><text x="501" y="748" font-size="26" fill="#183332" font-weight="normal" text-anchor="start">Keep role-specific variants when needed</text><path d="M1262 442 L1262 831 L696 831 L696 789" fill="none" stroke="#247C73" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M690 799 L696 789 L702 799" fill="none" stroke="#247C73" stroke-width="3"/><text x="700" y="877" font-size="25" fill="#247C73" font-weight="normal" text-anchor="middle">Return problems and revisions; a designated maintainer updates or retains variants</text></g></svg>