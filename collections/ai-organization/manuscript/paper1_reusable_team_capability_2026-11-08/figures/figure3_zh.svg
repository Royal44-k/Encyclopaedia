<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="950" viewBox="0 0 1400 950" style="font-synthesis:none"><rect width="1400" height="950" fill="white"/><g font-family="Microsoft YaHei, Arial, sans-serif"><text x="36" y="48" font-size="34" fill="#183332" font-weight="bold" text-anchor="start">检验交接方式，而不只检验工具能否运行</text><text x="36" y="91" font-size="25" fill="#657472" font-weight="normal" text-anchor="start">拟议研究设计  ·  图中没有实测数据</text><text x="36" y="139" font-size="27" fill="#183332" font-weight="normal" text-anchor="start">各组使用相同的 AI 模型、原始工作方法和任务集合</text><text x="36" y="174" font-size="25" fill="#657472" font-weight="normal" text-anchor="start">预先设置相同的支持预算上限，记录实际投入</text><rect x="36" y="200" width="424" height="156" rx="9" fill="white" stroke="#C5D6D2" stroke-width="2"/><text x="60" y="244" font-size="29" fill="#247C73" font-weight="bold" text-anchor="start">A</text><text x="111" y="244" font-size="26" fill="#183332" font-weight="normal" text-anchor="start">提示词</text><text x="111" y="283" font-size="26" fill="#183332" font-weight="normal" text-anchor="start">及基本任务说明</text><rect x="488" y="200" width="424" height="156" rx="9" fill="white" stroke="#C5D6D2" stroke-width="2"/><text x="512" y="244" font-size="29" fill="#247C73" font-weight="bold" text-anchor="start">B</text><text x="563" y="244" font-size="26" fill="#183332" font-weight="normal" text-anchor="start">可运行方法</text><rect x="940" y="200" width="424" height="156" rx="9" fill="#EAF4F1" stroke="#C5D6D2" stroke-width="2"/><text x="964" y="244" font-size="29" fill="#247C73" font-weight="bold" text-anchor="start">C</text><text x="1015" y="244" font-size="26" fill="#183332" font-weight="normal" text-anchor="start">同一可运行方法</text><text x="1015" y="283" font-size="26" fill="#183332" font-weight="normal" text-anchor="start">加交接、适配</text><text x="1015" y="322" font-size="26" fill="#183332" font-weight="normal" text-anchor="start">与维护支持</text><text x="36" y="406" font-size="28" fill="#183332" font-weight="bold" text-anchor="start">分别设置观察时点与变化条件</text><text x="50" y="460" font-size="29" fill="#247C73" font-weight="bold" text-anchor="start">首次使用</text><text x="50" y="502" font-size="24" fill="#183332" font-weight="normal" text-anchor="start">新同事能否启动并交付</text><path d="M426 452 L470 452" fill="none" stroke="#247C73" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M460 446 L470 452 L460 458" fill="none" stroke="#247C73" stroke-width="3"/><text x="502" y="460" font-size="29" fill="#247C73" font-weight="bold" text-anchor="start">延后再用</text><text x="502" y="502" font-size="24" fill="#183332" font-weight="normal" text-anchor="start">隔一段时间能否再次完成</text><text x="954" y="460" font-size="29" fill="#247C73" font-weight="bold" text-anchor="start">改变一个条件</text><text x="954" y="502" font-size="24" fill="#183332" font-weight="normal" text-anchor="start">更换输入或工具版本</text><text x="954" y="533" font-size="24" fill="#183332" font-weight="normal" text-anchor="start">与同时点未变化任务比较</text><path d="M36 589 L1364 589" fill="none" stroke="#C5D6D2" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="36" y="637" font-size="27" fill="#247C73" font-weight="normal" text-anchor="start">分别观察运行、适用范围判断与修订回传</text><text x="36" y="692" font-size="28" fill="#183332" font-weight="bold" text-anchor="start">并列报告</text><rect x="44" y="737" width="70" height="86" rx="6" fill="#EAF4F1" stroke="#247C73" stroke-width="2"/><path d="M59 762 L99 762" fill="none" stroke="#247C73" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M59 779 L99 779" fill="none" stroke="#247C73" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M59 796 L99 796" fill="none" stroke="#247C73" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="146" y="748" font-size="25" fill="#183332" font-weight="normal" text-anchor="start">输出质量、关键遗漏与失败</text><text x="146" y="787" font-size="25" fill="#183332" font-weight="normal" text-anchor="start">保留放弃使用的记录</text><text x="146" y="826" font-size="25" fill="#183332" font-weight="normal" text-anchor="start">由不知道分组的评分者评估</text><rect x="747" y="742" width="86" height="77" rx="7" fill="#EAF4F1" stroke="#247C73" stroke-width="2"/><path d="M747 766 L833 766 M768 733 L768 752 M812 733 L812 752" fill="none" stroke="#247C73" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M770 789 L785 803 L814 776" fill="none" stroke="#247C73" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><text x="861" y="748" font-size="25" fill="#183332" font-weight="normal" text-anchor="start">制作者与接收者的总投入</text><text x="861" y="787" font-size="25" fill="#183332" font-weight="normal" text-anchor="start">含准备、适配、答疑</text><text x="861" y="826" font-size="25" fill="#183332" font-weight="normal" text-anchor="start">以及后续维护</text><text x="36" y="910" font-size="25" fill="#657472" font-weight="normal" text-anchor="start">公开仓库适合研究材料与版本变化；上述行为结果需要另行取得使用证据。</text></g></svg>