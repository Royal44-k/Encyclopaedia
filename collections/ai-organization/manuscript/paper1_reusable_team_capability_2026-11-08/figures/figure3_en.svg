<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="950" viewBox="0 0 1400 950" style="font-synthesis:none"><rect width="1400" height="950" fill="white"/><g font-family="Arial, Microsoft YaHei, sans-serif"><text x="36" y="48" font-size="34" fill="#183332" font-weight="bold" text-anchor="start">Test the handover, not only whether the tool runs</text><text x="36" y="91" font-size="25" fill="#657472" font-weight="normal" text-anchor="start">Proposed research design  ·  No observed results are shown</text><text x="36" y="139" font-size="27" fill="#183332" font-weight="normal" text-anchor="start">Same AI model, underlying working method and set of tasks in all groups</text><text x="36" y="174" font-size="25" fill="#657472" font-weight="normal" text-anchor="start">Equal support-budget ceilings; record actual expenditure</text><rect x="36" y="200" width="424" height="156" rx="9" fill="white" stroke="#C5D6D2" stroke-width="2"/><text x="60" y="244" font-size="29" fill="#247C73" font-weight="bold" text-anchor="start">A</text><text x="111" y="244" font-size="26" fill="#183332" font-weight="normal" text-anchor="start">Prompt and basic</text><text x="111" y="283" font-size="26" fill="#183332" font-weight="normal" text-anchor="start">task instructions</text><rect x="488" y="200" width="424" height="156" rx="9" fill="white" stroke="#C5D6D2" stroke-width="2"/><text x="512" y="244" font-size="29" fill="#247C73" font-weight="bold" text-anchor="start">B</text><text x="563" y="244" font-size="26" fill="#183332" font-weight="normal" text-anchor="start">Runnable method</text><rect x="940" y="200" width="424" height="156" rx="9" fill="#EAF4F1" stroke="#C5D6D2" stroke-width="2"/><text x="964" y="244" font-size="29" fill="#247C73" font-weight="bold" text-anchor="start">C</text><text x="1015" y="244" font-size="26" fill="#183332" font-weight="normal" text-anchor="start">Same runnable method</text><text x="1015" y="283" font-size="26" fill="#183332" font-weight="normal" text-anchor="start">plus handover, adaptation</text><text x="1015" y="322" font-size="26" fill="#183332" font-weight="normal" text-anchor="start">and maintenance support</text><text x="36" y="406" font-size="28" fill="#183332" font-weight="bold" text-anchor="start">Specify assessment times and changes separately</text><text x="50" y="460" font-size="29" fill="#247C73" font-weight="bold" text-anchor="start">First use</text><text x="50" y="502" font-size="24" fill="#183332" font-weight="normal" text-anchor="start">Can the colleague start and deliver?</text><path d="M426 452 L470 452" fill="none" stroke="#247C73" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M460 446 L470 452 L460 458" fill="none" stroke="#247C73" stroke-width="3"/><text x="502" y="460" font-size="29" fill="#247C73" font-weight="bold" text-anchor="start">Delayed reuse</text><text x="502" y="502" font-size="24" fill="#183332" font-weight="normal" text-anchor="start">Can the work be repeated later?</text><text x="954" y="460" font-size="29" fill="#247C73" font-weight="bold" text-anchor="start">Change one condition</text><text x="954" y="502" font-size="24" fill="#183332" font-weight="normal" text-anchor="start">Vary inputs or the tool version</text><text x="954" y="533" font-size="24" fill="#183332" font-weight="normal" text-anchor="start">Compare with unchanged tasks</text><text x="954" y="564" font-size="24" fill="#183332" font-weight="normal" text-anchor="start">assessed at the same time</text><path d="M36 589 L1364 589" fill="none" stroke="#C5D6D2" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="36" y="637" font-size="27" fill="#247C73" font-weight="normal" text-anchor="start">Track execution, scope judgments and returned revisions separately</text><text x="36" y="692" font-size="28" fill="#183332" font-weight="bold" text-anchor="start">Report together</text><rect x="44" y="737" width="70" height="86" rx="6" fill="#EAF4F1" stroke="#247C73" stroke-width="2"/><path d="M59 762 L99 762" fill="none" stroke="#247C73" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M59 779 L99 779" fill="none" stroke="#247C73" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M59 796 L99 796" fill="none" stroke="#247C73" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="146" y="748" font-size="25" fill="#183332" font-weight="normal" text-anchor="start">Quality, omissions and failures</text><text x="146" y="787" font-size="25" fill="#183332" font-weight="normal" text-anchor="start">Retain abandoned attempts</text><text x="146" y="826" font-size="25" fill="#183332" font-weight="normal" text-anchor="start">Use assessors blind to allocation</text><rect x="747" y="742" width="86" height="77" rx="7" fill="#EAF4F1" stroke="#247C73" stroke-width="2"/><path d="M747 766 L833 766 M768 733 L768 752 M812 733 L812 752" fill="none" stroke="#247C73" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M770 789 L785 803 L814 776" fill="none" stroke="#247C73" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><text x="861" y="748" font-size="25" fill="#183332" font-weight="normal" text-anchor="start">Total effort on both sides</text><text x="861" y="787" font-size="25" fill="#183332" font-weight="normal" text-anchor="start">Include preparation, help,</text><text x="861" y="826" font-size="25" fill="#183332" font-weight="normal" text-anchor="start">adaptation and maintenance</text><text x="36" y="910" font-size="25" fill="#657472" font-weight="normal" text-anchor="start">Public repositories reveal artifacts and revisions; behavioral outcomes require use evidence.</text></g></svg>